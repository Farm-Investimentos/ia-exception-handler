name: Publish NPM SDKs

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Which SDK to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - vue

permissions:
  contents: read

jobs:
  publish-node-sdk:
    name: Publish @farm-investimentos/exception-intelligence-sdk-node
    runs-on: ubuntu-latest
    environment: npm-publish
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'node'))
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vue-sdk:
    name: Publish @farm-investimentos/exception-intelligence-sdk-vue
    runs-on: ubuntu-latest
    environment: npm-publish
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'vue'))
    defaults:
      run:
        working-directory: sdks/vue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
